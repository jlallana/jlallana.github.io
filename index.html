<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema de votación</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    @media print {
      #seccion-formulario, #seccion-resultados .no-print { display: none !important; }
    }
  </style>
</head>
<body class="container py-4">

  <h1 class="mb-4">Sistema de votación</h1>

  <!-- FORMULARIO -->
  <div id="seccion-formulario">
    <form id="form-votacion" novalidate>

      <div class="mb-4">
        <label for="punto" class="form-label fw-bold">Punto a votar</label>
        <textarea id="punto" class="form-control" rows="3" required></textarea>
        <div class="invalid-feedback">Ingresá el punto a votar.</div>
      </div>

      <div class="row g-4">
        <!-- Grupo 1 -->
        <div class="col-md-6">
          <fieldset class="border rounded p-3" id="fieldset-1">
            <legend class="fw-bold fs-6">Grupo 1 <small class="text-muted fw-normal">(pondera 2/3)</small></legend>
            <div class="mb-2">
              <label class="form-label">Presentes</label>
              <input type="number" class="form-control" id="p1" min="0" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Afirmativo</label>
              <input type="number" class="form-control" id="a1" min="0" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Abstención</label>
              <input type="number" class="form-control" id="ab1" min="0" required>
            </div>
            <div class="invalid-feedback d-block text-danger small" id="error-1"></div>
          </fieldset>
        </div>

        <!-- Grupo 2 -->
        <div class="col-md-6">
          <fieldset class="border rounded p-3" id="fieldset-2">
            <legend class="fw-bold fs-6">Grupo 2 <small class="text-muted fw-normal">(pondera 1/3)</small></legend>
            <div class="mb-2">
              <label class="form-label">Presentes</label>
              <input type="number" class="form-control" id="p2" min="0" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Afirmativo</label>
              <input type="number" class="form-control" id="a2" min="0" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Abstención</label>
              <input type="number" class="form-control" id="ab2" min="0" required>
            </div>
            <div class="invalid-feedback d-block text-danger small" id="error-2"></div>
          </fieldset>
        </div>
      </div>

      <button type="submit" class="btn btn-primary mt-4" id="btn-confirmar" disabled>Confirmar</button>
    </form>
  </div>

  <!-- RESULTADOS -->
  <div id="seccion-resultados" class="d-none">
    <h2 class="mb-1">Resultado</h2>
    <blockquote class="blockquote border-start ps-3 mb-4" id="resultado-punto"></blockquote>

    <table class="table table-bordered w-auto mb-4">
      <thead><tr><th>Categoría</th><th>Porcentaje</th></tr></thead>
      <tbody>
        <tr><td>Afirmativo</td><td id="r-afirmativo"></td></tr>
        <tr><td>Abstención</td><td id="r-abstencion"></td></tr>
        <tr><td>No voto</td><td id="r-novoto"></td></tr>
      </tbody>
    </table>

    <div class="mb-1">Afirmativo</div>
    <progress id="bar-afirmativo" class="w-100 mb-3" max="100" style="accent-color: #198754;"></progress>

    <div class="mb-1">Abstención</div>
    <progress id="bar-abstencion" class="w-100 mb-3" max="100" style="accent-color: #dc3545;"></progress>

    <div class="mb-1">No voto</div>
    <progress id="bar-novoto" class="w-100 mb-4" max="100" style="accent-color: #6c757d;"></progress>

    <div class="no-print">
      <button class="btn btn-secondary me-2" id="btn-corregir">Corregir</button>
      <button class="btn btn-outline-primary" id="btn-nuevo">Votar de nuevo</button>
    </div>
  </div>

  <script>
    const campos = ['punto', 'p1', 'a1', 'ab1', 'p2', 'a2', 'ab2'];
    const btnConfirmar = document.getElementById('btn-confirmar');

    // Habilitar Confirmar cuando todos los campos tienen valor y los datos son consistentes
    campos.forEach(id => {
      document.getElementById(id).addEventListener('input', () => {
        const llenos = campos.every(i => document.getElementById(i).value.trim() !== '');
        const p1 = +document.getElementById('p1').value;
        const a1 = +document.getElementById('a1').value;
        const ab1 = +document.getElementById('ab1').value;
        const p2 = +document.getElementById('p2').value;
        const a2 = +document.getElementById('a2').value;
        const ab2 = +document.getElementById('ab2').value;
        const consistente = (a1 + ab1 <= p1) && (a2 + ab2 <= p2);
        document.getElementById('error-1').textContent = llenos && a1 + ab1 > p1 ? 'Los votos superan los presentes.' : '';
        document.getElementById('error-2').textContent = llenos && a2 + ab2 > p2 ? 'Los votos superan los presentes.' : '';
        btnConfirmar.disabled = !(llenos && consistente);
      });
    });

    document.getElementById('form-votacion').addEventListener('submit', function(e) {
      e.preventDefault();

      const punto = document.getElementById('punto').value.trim();
      const p1 = +document.getElementById('p1').value;
      const a1 = +document.getElementById('a1').value;
      const ab1 = +document.getElementById('ab1').value;
      const p2 = +document.getElementById('p2').value;
      const a2 = +document.getElementById('a2').value;
      const ab2 = +document.getElementById('ab2').value;

      // Limpiar errores previos
      document.getElementById('punto').classList.remove('is-invalid');

      let valido = true;

      if (!punto) {
        document.getElementById('punto').classList.add('is-invalid');
        valido = false;
      }

      if (p1 === 0 && p2 === 0) {
        alert('Al menos un grupo debe tener presentes.');
        valido = false;
      }

      if (!valido) return;

      // Cálculo ponderado
      const peso1 = p1 > 0 && p2 > 0 ? 2/3 : (p1 > 0 ? 1 : 0);
      const peso2 = p1 > 0 && p2 > 0 ? 1/3 : (p2 > 0 ? 1 : 0);

      const afirmativo = ((p1 > 0 ? a1/p1 : 0) * peso1 + (p2 > 0 ? a2/p2 : 0) * peso2) * 100;
      const abstencion = ((p1 > 0 ? ab1/p1 : 0) * peso1 + (p2 > 0 ? ab2/p2 : 0) * peso2) * 100;
      const novoto = 100 - afirmativo - abstencion;

      document.getElementById('resultado-punto').textContent = punto;
      document.getElementById('r-afirmativo').textContent = afirmativo.toFixed(2) + '%';
      document.getElementById('r-abstencion').textContent = abstencion.toFixed(2) + '%';
      document.getElementById('r-novoto').textContent = novoto.toFixed(2) + '%';
      document.getElementById('bar-afirmativo').value = afirmativo;
      document.getElementById('bar-abstencion').value = abstencion;
      document.getElementById('bar-novoto').value = novoto;

      document.getElementById('seccion-formulario').classList.add('d-none');
      document.getElementById('seccion-resultados').classList.remove('d-none');
    });

    document.getElementById('btn-corregir').addEventListener('click', () => {
      document.getElementById('seccion-resultados').classList.add('d-none');
      document.getElementById('seccion-formulario').classList.remove('d-none');
    });

    document.getElementById('btn-nuevo').addEventListener('click', () => {
      document.getElementById('form-votacion').reset();
      campos.forEach(id => document.getElementById(id).classList.remove('is-invalid'));
      document.getElementById('error-1').textContent = '';
      document.getElementById('error-2').textContent = '';
      btnConfirmar.disabled = true;
      document.getElementById('seccion-resultados').classList.add('d-none');
      document.getElementById('seccion-formulario').classList.remove('d-none');
    });
  </script>

</body>
</html>
