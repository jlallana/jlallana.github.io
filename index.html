<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema de votación</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    @media print {
      #seccion-formulario, #seccion-resultados .no-print { display: none !important; }
    }
  </style>
</head>
<body>
  <header class="bg-primary text-white py-3 mb-4">
    <div class="container">
      <h1 class="h4 mb-0">Sistema de votación</h1>
    </div>
  </header>

  <div class="container">

  <!-- INICIO -->
  <div id="seccion-inicio">
    <p class="text-muted">Ingresá los puntos a votar antes de comenzar.</p>
    <div id="lista-puntos"></div>
    <button type="button" class="btn btn-outline-secondary mt-2 me-2" id="btn-agregar">+ Agregar punto</button>
    <button type="button" class="btn btn-primary mt-2" id="btn-comenzar">Comenzar</button>
  </div>

  <!-- FORMULARIO -->
  <div id="seccion-formulario" class="d-none">
    <form id="form-votacion" novalidate>

      <div class="mb-4">
        <div class="d-flex justify-content-between align-items-baseline mb-1">
          <label class="form-label fw-bold mb-0">Punto a votar</label>
          <small class="text-muted" id="progreso"></small>
        </div>
        <textarea id="punto" class="form-control bg-light" rows="3" readonly></textarea>
      </div>

      <div class="row g-4">
        <!-- Grupo 1 -->
        <div class="col-md-6">
          <fieldset class="border rounded p-3" id="fieldset-1">
            <legend class="fw-bold fs-6">Grupo 1 <small class="text-muted fw-normal">(pondera 2/3)</small></legend>
            <div class="mb-2">
              <label class="form-label">Presentes</label>
              <input type="number" class="form-control" id="p1" min="0" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Afirmativo</label>
              <input type="number" class="form-control" id="a1" min="0" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Abstención</label>
              <input type="number" class="form-control" id="ab1" min="0" required>
            </div>
          </fieldset>
        </div>

        <!-- Grupo 2 -->
        <div class="col-md-6">
          <fieldset class="border rounded p-3" id="fieldset-2">
            <legend class="fw-bold fs-6">Grupo 2 <small class="text-muted fw-normal">(pondera 1/3)</small></legend>
            <div class="mb-2">
              <label class="form-label">Presentes</label>
              <input type="number" class="form-control" id="p2" min="0" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Afirmativo</label>
              <input type="number" class="form-control" id="a2" min="0" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Abstención</label>
              <input type="number" class="form-control" id="ab2" min="0" required>
            </div>
          </fieldset>
        </div>
      </div>

      <button type="submit" class="btn btn-primary mt-4" id="btn-confirmar">Confirmar</button>
    </form>
  </div>

  <!-- RESULTADOS -->
  <div id="seccion-resultados" class="d-none">
    <blockquote class="blockquote border-start ps-3 mb-4" id="resultado-punto"></blockquote>

    <div class="mb-3">
      <div><strong>Afirmativo</strong> <span id="r-afirmativo"></span> <span class="text-muted fst-italic small" id="c-afirmativo"></span></div>
      <progress id="bar-afirmativo" class="w-100" max="100" style="accent-color: #198754;"></progress>
    </div>

    <div class="mb-3">
      <div><strong>Abstención</strong> <span id="r-abstencion"></span> <span class="text-muted fst-italic small" id="c-abstencion"></span></div>
      <progress id="bar-abstencion" class="w-100" max="100" style="accent-color: #dc3545;"></progress>
    </div>

    <div class="mb-4">
      <div><strong>No voto</strong> <span id="r-novoto"></span> <span class="text-muted fst-italic small" id="c-novoto"></span></div>
      <progress id="bar-novoto" class="w-100" max="100" style="accent-color: #6c757d;"></progress>
    </div>

    <div class="no-print">
      <button class="btn btn-secondary me-2" id="btn-corregir">Corregir</button>
      <button class="btn btn-outline-secondary me-2" id="btn-anexo">Votar anexo</button>
      <button class="btn btn-outline-primary" id="btn-siguiente">Siguiente punto</button>
      <button class="btn btn-outline-danger d-none" id="btn-reiniciar">Reiniciar</button>
    </div>
  </div>

  </div>

  <script>
    const puntosDefault = [
      'Se propone modificar el reglamento interno para que las reuniones ordinarias pasen de frecuencia semanal a quincenal.',
    ];

    let puntos = [];
    let indice = 0;
    let esAnexo = false;

    const $ = id => document.getElementById(id);
    const val = id => +$(id).value;
    const getDatos = () => ({
      punto: $('punto').value.trim(),
      p1: val('p1'), a1: val('a1'), ab1: val('ab1'),
      p2: val('p2'), a2: val('a2'), ab2: val('ab2')
    });

    const agregarTextarea = (valor = '') => {
      const lista = $('lista-puntos');
      const n = lista.children.length + 1;
      const wrap = document.createElement('div');
      wrap.className = 'mb-2';
      wrap.innerHTML = `<label class="form-label fw-bold">Punto ${n}</label><textarea class="form-control punto-input" rows="2">${valor}</textarea>`;
      lista.appendChild(wrap);
    };

    puntosDefault.forEach(t => agregarTextarea(t));

    $('btn-agregar').addEventListener('click', () => agregarTextarea());

    $('btn-comenzar').addEventListener('click', () => {
      puntos = [...document.querySelectorAll('.punto-input')]
        .map(ta => ta.value.trim()).filter(t => t);
      if (puntos.length === 0) { alert('Ingresá al menos un punto a votar.'); return; }
      indice = 0;
      cargarPunto();
      $('seccion-inicio').classList.add('d-none');
      $('seccion-formulario').classList.remove('d-none');
    });

    const cargarPunto = () => {
      $('punto').value = puntos[indice];
      $('punto').readOnly = true;
      $('punto').classList.add('bg-light');
      $('progreso').textContent = `Punto ${indice + 1} de ${puntos.length}`;
    };

    const mostrarBotones = () => {
      const esUltimo = indice === puntos.length - 1;
      $('btn-anexo').classList.toggle('d-none', esAnexo);
      $('btn-siguiente').classList.toggle('d-none', esUltimo && !esAnexo);
      $('btn-reiniciar').classList.toggle('d-none', !(esUltimo && !esAnexo));
    };

    $('form-votacion').addEventListener('submit', function(e) {
      e.preventDefault();
      const { punto, p1, a1, ab1, p2, a2, ab2 } = getDatos();

      if (a1 + ab1 > p1) { alert('Grupo 1: los votos superan los presentes.'); return; }
      if (a2 + ab2 > p2) { alert('Grupo 2: los votos superan los presentes.'); return; }
      if (p1 === 0 && p2 === 0) { alert('Al menos un grupo debe tener presentes.'); return; }

      const peso1 = p1 > 0 && p2 > 0 ? 2/3 : (p1 > 0 ? 1 : 0);
      const peso2 = p1 > 0 && p2 > 0 ? 1/3 : (p2 > 0 ? 1 : 0);
      const afirmativo = ((p1 > 0 ? a1/p1 : 0) * peso1 + (p2 > 0 ? a2/p2 : 0) * peso2) * 100;
      const abstencion = ((p1 > 0 ? ab1/p1 : 0) * peso1 + (p2 > 0 ? ab2/p2 : 0) * peso2) * 100;
      const novoto = 100 - afirmativo - abstencion;

      const calcStr = (n1, d1, n2, d2) =>
        d1 > 0 && d2 > 0 ? `(${n1}/${d1} × 2/3) + (${n2}/${d2} × 1/3)` :
        d1 > 0 ? `${n1}/${d1}` : `${n2}/${d2}`;

      $('resultado-punto').textContent = punto;
      [['afirmativo', afirmativo, a1, p1, a2, p2],
       ['abstencion', abstencion, ab1, p1, ab2, p2],
       ['novoto', novoto, p1-a1-ab1, p1, p2-a2-ab2, p2]
      ].forEach(([k, pct, n1, d1, n2, d2]) => {
        $(`r-${k}`).textContent = pct.toFixed(2) + '%';
        $(`c-${k}`).textContent = calcStr(n1, d1, n2, d2);
        $(`bar-${k}`).value = pct;
      });

      mostrarBotones();
      $('seccion-formulario').classList.add('d-none');
      $('seccion-resultados').classList.remove('d-none');
    });

    $('btn-corregir').addEventListener('click', () => {
      $('seccion-resultados').classList.add('d-none');
      $('seccion-formulario').classList.remove('d-none');
    });

    $('btn-anexo').addEventListener('click', () => {
      esAnexo = true;
      $('form-votacion').reset();
      $('punto').value = '';
      $('punto').readOnly = false;
      $('punto').classList.remove('bg-light');
      $('progreso').textContent = `Punto ${indice + 1}.1 (anexo)`;
      $('seccion-resultados').classList.add('d-none');
      $('seccion-formulario').classList.remove('d-none');
    });

    $('btn-reiniciar').addEventListener('click', () => {
      indice = 0;
      esAnexo = false;
      $('form-votacion').reset();
      $('seccion-resultados').classList.add('d-none');
      $('seccion-inicio').classList.remove('d-none');
    });

    $('btn-siguiente').addEventListener('click', () => {
      indice++;
      esAnexo = false;
      $('form-votacion').reset();
      cargarPunto();
      $('seccion-resultados').classList.add('d-none');
      $('seccion-formulario').classList.remove('d-none');
    });
  </script>

</body>
</html>
